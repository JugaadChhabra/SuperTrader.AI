metadata:
  version: "3.1"
  last_updated: "2025-10-12"
  description: "NSE Index Futures market specifications"
  focus: "Core Market Data Only - Verified from Codebase"

# NSE Index Futures Universe - Static Market Specifications
# Global specifications (apply to all index futures)
global_futures_specs:
  tick_size: 0.05                    # All index futures have ₹0.05 tick
  min_price_movement: 0.05           # Minimum price change
  settlement_type: "cash_settled"    # All index futures are cash settled
  multiplier: 1                      # Point value multiplier
  contract_type: "index_futures"
  exchange_code: "NFO"               # NSE F&O segment
  currency: "INR"                    # All contracts in Indian Rupees
  
index_futures:
  NIFTY:
    symbol: "NIFTY"
    description: "Nifty 50 Index Futures"
    lot_size: 50
    point_value_inr: 50.0
    underlying: "NIFTY_50_INDEX"
      
  BANKNIFTY:
    symbol: "BANKNIFTY"
    description: "Bank Nifty Index Futures"
    lot_size: 25
    point_value_inr: 25.0
    underlying: "BANK_NIFTY_INDEX"

  FINNIFTY:
    symbol: "FINNIFTY"
    description: "Financial Services Index Futures"
    lot_size: 40
    point_value_inr: 40.0
    underlying: "NIFTY_FIN_SERVICES_INDEX"
      
  MIDCPNIFTY:
    symbol: "MIDCPNIFTY"
    description: "Nifty Midcap Select Index Futures"
    lot_size: 50
    point_value_inr: 50.0
    underlying: "NIFTY_MIDCAP_SELECT_INDEX"

  CNXPHARMA:
    symbol: "CNXPHARMA"
    description: "CNX Pharma Index Futures"
    lot_size: 30
    point_value_inr: 30.0
    underlying: "CNX_PHARMA_INDEX"
      
  CNXIT:
    symbol: "CNXIT"
    description: "CNX IT Index Futures"
    lot_size: 50
    point_value_inr: 50.0
    underlying: "CNX_IT_INDEX"

# Core Market Sessions and Schedule (Verified from Code)
market_sessions:
  nse_derivatives:
    pre_open: "09:00-09:15"           # Pre-open auction session
    regular_trading: "09:15-15:30"   # Main trading session (verified in loaders.py)
    timezone: "Asia/Kolkata"
    
  # Trading calendar
  trading_schedule:
    trading_days: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"]
    weekend_closed: ["Saturday", "Sunday"]
    
  # Time constraints from execution agent
  auto_square_off:
    warning_time: "15:10:00"          # Auto square-off warning at 3:10 PM
    force_exit_time: "15:20:00"       # Broker force exit at 3:20 PM
    time_penalty_threshold: 45        # Reduce position size if < 45 mins to close
    
  # Fixed Date Market Holidays (Annual)
  fixed_holidays:
    "01-26": "Republic Day"
    "08-15": "Independence Day" 
    "10-02": "Gandhi Jayanti"
    "12-25": "Christmas"
    
  # Variable Date Holidays (dates change yearly - examples for 2025)
  variable_holidays_2025:
    "03-14": "Holi"
    "04-18": "Good Friday"
    "04-21": "Ram Navami" 
    "05-01": "Maharashtra Day"
    "08-19": "Raksha Bandhan"
    "09-07": "Ganesh Chaturthi"
    "10-12": "Dussehra"
    "11-01": "Diwali (Laxmi Puja)"
    "11-02": "Diwali (Balipratipada)"
    "11-15": "Guru Nanak Jayanti"
    
  # Special trading sessions
  special_sessions:
    muhurat_trading: "Diwali evening 18:00-19:00"  # Special 1-hour session

# Contract Naming Convention (NSE Standard Format)
contract_naming:
  monthly_format: "{INDEX}{YY}{MON}FUT"     # e.g., NIFTY25JANFUT
  monthly_pattern: "^[A-Z]+\\d{2}(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)FUT$"
  
  # Month abbreviations used by NSE
  month_codes:
    "01": "JAN"
    "02": "FEB" 
    "03": "MAR"
    "04": "APR"
    "05": "MAY"
    "06": "JUN"
    "07": "JUL"
    "08": "AUG"
    "09": "SEP"
    "10": "OCT"
    "11": "NOV"
    "12": "DEC"

# Exchange and Trading Rules (Static Information)
exchange_info:
  exchange_name: "NSE"
  exchange_code: "NSE"
  country: "IN"
  base_currency: "INR"               # All futures contracts in INR
  regulatory_authority: "SEBI"
  
  # Contract specifications
  contract_specs:
    expiry_day: "last_tuesday_of_month"
    expiry_time: "15:30:00"
    final_settlement_day: "expiry_day"
    contract_cycle_months: 3          # Current, next, far month
    
  # Price and quantity limits
  price_limits:
    circuit_breaker_pct: 10.0         # 10% price circuit breaker for indices
    daily_price_limit_pct: 10.0       # Daily price movement limit
    
  quantity_limits:
    min_order_quantity: 1             # Minimum 1 lot

# Transaction Costs (Verified from execution_agent.py)
transaction_costs:
  futures:
    brokerage_flat: 20.0              # ₹20 flat per order (verified)
    stt_sell_pct: 0.0125             # 0.0125% STT on sell side only (verified)
    exchange_charges_pct: 0.0019     # 0.0019% of turnover (verified)
    sebi_charges: 10.0               # ₹10 per crore turnover (verified)
    gst_pct: 18.0                    # 18% GST on brokerage + exchange charges
    total_cost_bp: 2.0               # Approx 2 bps total (verified in environment)
    
  options:
    brokerage_flat: 20.0
    stt_sell_pct: 0.0625             # 5x higher STT for options (verified)
    total_cost_bp: 8.0               # Higher costs for options

# Margin Requirements (Verified from multiple files)
margin_requirements:
  mis_mode:  # Intraday margins
    NIFTY: 60000                     # ₹60k per lot (verified in docs + code)
    BANKNIFTY: 75000                 # ₹75k per lot (verified in docs + code)
    FINNIFTY: 50000                  # ₹50k per lot (verified in docs + code)
    MIDCPNIFTY: 65000                # ₹65k per lot (from docs)
    CNXPHARMA: 70000                 # ₹70k per lot (from docs)
    CNXIT: 55000                     # Estimated based on lot size
    
  nrml_mode:  # Overnight margins (approx 2x MIS)
    NIFTY: 100000
    BANKNIFTY: 150000
    FINNIFTY: 80000
    MIDCPNIFTY: 110000
    CNXPHARMA: 120000
    CNXIT: 90000

# Risk Limits (Verified from code)
risk_limits:
  max_lots_per_symbol: 5             # Max 5 lots per symbol intraday (verified)
  max_exposure_pct: 50               # Max 50% of capital exposure (verified)
  target_volatility: 0.12            # 12% target vol for position sizing (verified)
  initial_capital: 500000            # ₹5 lakh default capital (verified)
    
# Market Structure (Verified from execution_agent.py)
market_structure:
  order_types: ["MARKET", "LIMIT", "SL", "SL-M"]
  validity_types: ["DAY", "IOC", "GTC"]
  product_types: ["MIS", "NRML"]        # MIS=Intraday, NRML=Overnight
  
# Data Feed Information (From ICICI constants)
data_feeds:
  primary_feed: "NSE_FO"
  icici_websocket_url: "https://livestream.icicidirect.com"
  icici_api_base: "https://api.icicidirect.com/breezeapi/api/v1"
  
  # Symbol format for ICICI feed (verified in icici_broker.py)
  symbol_format: "NSE:{INDEX}{YY}{MON}FUT"  # e.g., NSE:NIFTY25OCTFUT
  
# Rollover Configuration (From futures_manager.py structure)
rollover_config:
  rollover_methods: ["ratio", "difference"]  # Adjustment methods available
  default_method: "ratio"                   # Ratio method is default
  rollover_trigger_days: 3                  # Start rollover 3 days before expiry
  
  # Rollover detection thresholds
  gap_threshold_pct: 2.0                    # 2% gap threshold for rollover detection
  volume_multiple: 1.0                      # Volume should be > rolling mean

# Data Validation Thresholds (From constants.py)
validation_thresholds:
  price_spike_multiplier: 2.0               # 2x 99th percentile for spike detection
  time_gap_multiplier: 2.0                  # 2x expected frequency for gap detection
  zero_volume_threshold_pct: 10.0           # 10% of bars with zero volume allowed
  oi_change_threshold_pct: 50.0             # 50% change in OI threshold

# Technical Analysis Periods (From constants.py)
analysis_periods:
  rolling_periods: [5, 10, 20, 50, 100]    # Standard rolling window periods
  trading_days_per_year: 252               # For annualization
  volatility_factor: 252                   # EWMA annualization factor

# Position Sizing Parameters (From rl_strategy_agent.py)
position_sizing:
  volatility_bounds: [0.5, 2.0]           # Vol scalar clipping bounds
  kelly_clip_factor: 0.25                  # Conservative Kelly fraction
  time_scaling_threshold: 45               # Minutes before close to scale down

# Demo and Testing Configuration (From constants.py)
demo_config:
  default_symbols: "NSE:SBIN,NSE:RELIANCE"
  chart_duration_minutes: 5                # 5 minutes for demo charts
  chart_interval_seconds: 60               # 60 seconds between updates
  default_config_path: "../configs/market.yaml"

# Data Quality Metrics (From constants.py)
data_quality:
  default_risk_free_rate: 0.06             # 6% default risk-free rate
  ohlcvi_columns: ["open", "high", "low", "close", "volume", "open_interest"]
  price_columns: ["open", "high", "low", "close"]
  numeric_columns: ["open", "high", "low", "close", "volume", "open_interest"]
  
  # Column mapping for data standardization
  column_mapping:
    datetime: "timestamp"
    oi: "open_interest"