# SuperTrader.AI Market Configuration - Index Futures Focus
# Contains NSE Index Futures specifications, trading sessions, costs, and risk parameters
# Version: 2.0 | Last Updated: 2025-10-03 | Focus: Index Futures Trading

metadata:
  version: "2.0"
  last_updated: "2025-10-03"
  description: "NSE Index Futures market configuration for SuperTrader.AI"
  maintainer: "SuperTrader.AI Team"
  focus: "Index Futures Trading System"

# NSE Index Futures Universe - Liquid Contracts Only
index_futures:
  # Tier 1: Ultra High Liquidity (Primary Focus)
  tier_1_ultra_liquid:
    NIFTY:
      symbol: "NIFTY"
      description: "Nifty 50 Index Futures"
      lot_size: 50
      tick_size: 0.05
      point_value_inr: 50.0              # ₹50 per index point
      margin_nrml_pct: 10.0              # ~10% SPAN margin
      margin_mis_pct: 5.0                # ~5% MIS margin
      avg_daily_volume_lots: 500000      # ~5 lakh lots daily
      avg_daily_oi_lots: 2000000         # ~20 lakh lots OI
      contract_months: ["current", "next", "far"]
      rollover_day: "last_thursday"
      trading_hours: "09:15-15:30"
      settlement: "cash_settled"
      underlying: "NIFTY_50_INDEX"
      
    BANKNIFTY:
      symbol: "BANKNIFTY"
      description: "Bank Nifty Index Futures" 
      lot_size: 15
      tick_size: 0.05
      point_value_inr: 15.0              # ₹15 per index point
      margin_nrml_pct: 12.0              # Higher margin due to volatility
      margin_mis_pct: 6.0
      avg_daily_volume_lots: 300000      # ~3 lakh lots daily
      avg_daily_oi_lots: 1000000         # ~10 lakh lots OI
      contract_months: ["current", "next", "far"]
      rollover_day: "last_thursday"
      trading_hours: "09:15-15:30"
      settlement: "cash_settled"
      underlying: "BANK_NIFTY_INDEX"

  # Tier 2: High Liquidity (Secondary Focus)  
  tier_2_liquid:
    FINNIFTY:
      symbol: "FINNIFTY"
      description: "Financial Services Index Futures"
      lot_size: 25
      tick_size: 0.05
      point_value_inr: 25.0
      margin_nrml_pct: 11.0
      margin_mis_pct: 5.5
      avg_daily_volume_lots: 100000      # ~1 lakh lots daily
      avg_daily_oi_lots: 400000          # ~4 lakh lots OI
      contract_months: ["current", "next", "far"]
      rollover_day: "last_thursday"
      trading_hours: "09:15-15:30"
      settlement: "cash_settled"
      underlying: "NIFTY_FIN_SERVICES_INDEX"
      
    MIDCPNIFTY:
      symbol: "MIDCPNIFTY"
      description: "Nifty Midcap Select Index Futures"
      lot_size: 75
      tick_size: 0.05
      point_value_inr: 75.0
      margin_nrml_pct: 13.0              # Higher margin for midcap volatility
      margin_mis_pct: 6.5
      avg_daily_volume_lots: 50000       # ~50k lots daily
      avg_daily_oi_lots: 200000          # ~2 lakh lots OI
      contract_months: ["current", "next", "far"]
      rollover_day: "last_thursday"
      trading_hours: "09:15-15:30"
      settlement: "cash_settled"
      underlying: "NIFTY_MIDCAP_SELECT_INDEX"

  # Tier 3: Medium Liquidity (Opportunistic)
  tier_3_medium:
    CNXPHARMA:
      symbol: "CNXPHARMA"
      description: "CNX Pharma Index Futures"
      lot_size: 30
      tick_size: 0.05
      point_value_inr: 30.0
      margin_nrml_pct: 14.0
      margin_mis_pct: 7.0
      avg_daily_volume_lots: 25000       # ~25k lots daily
      avg_daily_oi_lots: 100000          # ~1 lakh lots OI
      contract_months: ["current", "next"]
      rollover_day: "last_thursday"
      trading_hours: "09:15-15:30"
      settlement: "cash_settled"
      underlying: "CNX_PHARMA_INDEX"
      
    CNXIT:
      symbol: "CNXIT"
      description: "CNX IT Index Futures"
      lot_size: 50
      tick_size: 0.05
      point_value_inr: 50.0
      margin_nrml_pct: 12.0
      margin_mis_pct: 6.0
      avg_daily_volume_lots: 40000       # ~40k lots daily
      avg_daily_oi_lots: 150000          # ~1.5 lakh lots OI
      contract_months: ["current", "next"]
      rollover_day: "last_thursday"
      trading_hours: "09:15-15:30"
      settlement: "cash_settled"
      underlying: "CNX_IT_INDEX"

# Contract specifications and rollover mechanics
contract_specifications:
  # Monthly contract cycle
  contract_cycle:
    current_month: "Near month contract - highest liquidity"
    next_month: "Second month contract - medium liquidity"  
    far_month: "Third month contract - lower liquidity"
    
  # Rollover specifications
  rollover_mechanics:
    rollover_date: "last_thursday_of_expiry_month"
    rollover_time: "15:30:00"
    notice_period_days: 5               # Start monitoring 5 days before
    auto_rollover_threshold_days: 2     # Auto-rollover 2 days before expiry
    rollover_spread_monitoring: true    # Monitor calendar spreads
    
  # Contract naming convention
  naming_convention:
    format: "{INDEX}{YYYY}{MM}{DD}"     # e.g., NIFTY20241226
    weekly_format: "{INDEX}{YY}{MMM}{W}{DD}"  # e.g., NIFTY24DEC1W26
    
  # Settlement specifications  
  settlement:
    settlement_type: "cash_settlement"
    settlement_price_method: "last_half_hour_vwap"  # VWAP of last 30 minutes
    settlement_time: "15:30:00"
    final_settlement_day: "expiry_day"

# Trading session timings for NSE Index Futures
market_sessions:
  nse_derivatives:
    pre_open:
      start: "09:00:00"
      end: "09:15:00"
      description: "Price discovery session - order matching for index futures"
    
    regular_trading:
      start: "09:15:00" 
      end: "15:30:00"
      description: "Main trading session for index futures and options"
    
    post_close:
      start: "15:40:00"
      end: "16:00:00"  
      description: "Closing price calculation period"
    
    timezone: "Asia/Kolkata"
    
  # Special sessions
  special_sessions:
    muhurat_trading:
      duration_minutes: 60
      description: "Diwali special session"
    
    pre_expiry_session:
      extended_hours: false             # No extended hours for index futures
      description: "Standard hours even on expiry day"
    
  # Market holidays for 2025 (major ones)
  market_holidays:
    - "2025-01-26"  # Republic Day
    - "2025-03-14"  # Holi
    - "2025-04-14"  # Ambedkar Jayanti  
    - "2025-04-18"  # Good Friday
    - "2025-05-01"  # May Day
    - "2025-08-15"  # Independence Day
    - "2025-08-16"  # Parsi New Year
    - "2025-10-02"  # Gandhi Jayanti
    - "2025-10-24"  # Dussehra
    - "2025-11-01"  # Diwali Balipratipada
    - "2025-11-14"  # Diwali
    - "2025-11-15"  # Govardhan Puja
    - "2025-12-25"  # Christmas

# Transaction cost structure (in basis points)
transaction_costs:
  # Equity delivery trading
  equity_delivery:
    brokerage_bps: 0.0          # Most discount brokers offer free delivery
    stt_bps: 10.0               # 0.1% on sell side only (buy side = 0)
    exchange_charges_bps: 0.345  # NSE transaction charges
    sebi_charges_bps: 0.2       # SEBI turnover fee
    stamp_duty_bps: 1.5         # State stamp duty (varies by state)
    gst_pct: 18.0               # GST on brokerage and other charges
    
  # Equity intraday trading  
  equity_intraday:
    brokerage_bps: 3.0          # 0.03% or ₹20 per order (whichever lower)
    stt_bps: 2.5                # 0.025% on sell side only
    exchange_charges_bps: 0.345
    sebi_charges_bps: 0.2
    stamp_duty_bps: 0.3         # Lower stamp duty for intraday
    gst_pct: 18.0
    
  # Index Futures trading (enhanced)
  index_futures:
    brokerage_flat: 20.0        # ₹20 per lot (most discount brokers)
    brokerage_percentage_cap: 0.05  # Max 0.05% of turnover
    stt_bps: 1.25               # 0.0125% on sell side only
    exchange_charges_bps: 1.73   # NSE F&O charges
    clearing_charges_bps: 0.05   # NSE clearing charges
    sebi_charges_bps: 0.0002     # SEBI charges (₹10 per crore)
    stamp_duty_bps: 0.002        # Stamp duty (₹200 per crore)
    gst_pct: 18.0               # GST on brokerage and other charges
    
    # Index-specific cost variations    
    cost_by_index:
      NIFTY:
        min_brokerage_per_lot: 15.0
        impact_cost_bps: 0.5     # Typical impact cost
      BANKNIFTY:
        min_brokerage_per_lot: 15.0  
        impact_cost_bps: 0.8     # Higher due to volatility
      FINNIFTY:
        min_brokerage_per_lot: 20.0
        impact_cost_bps: 1.0
      MIDCPNIFTY:
        min_brokerage_per_lot: 25.0
        impact_cost_bps: 1.5     # Higher impact cost
      CNXPHARMA:
        min_brokerage_per_lot: 30.0
        impact_cost_bps: 2.0
      CNXIT:
        min_brokerage_per_lot: 25.0
        impact_cost_bps: 1.2
    
  # Options trading
  options:
    brokerage_flat: 20.0        # Flat ₹20 per lot for most brokers
    stt_bps: 5.0                # 0.05% on premium on sell side
    exchange_charges_bps: 5.3    # Higher for options
    sebi_charges_bps: 0.2
    stamp_duty_bps: 0.3
    gst_pct: 18.0

# Risk management parameters for Index Futures
risk_parameters:
  # Index Futures Position Limits
  index_futures_position_limits:
    max_single_index_exposure_pct: 10.0     # Max 10% capital in one index
    max_total_futures_leverage: 5.0         # Max 5x leverage across all futures
    max_notional_exposure_cr: 50.0          # Max ₹50 cr notional per index
    max_correlation_exposure: 0.6           # Reduce for correlated indices
    
    # Per-index position limits (based on liquidity)
    position_limits_by_tier:
      tier_1_ultra_liquid:                  # NIFTY, BANKNIFTY
        max_lots_per_position: 500
        max_capital_pct: 8.0
      tier_2_liquid:                        # FINNIFTY, MIDCPNIFTY  
        max_lots_per_position: 200
        max_capital_pct: 5.0
      tier_3_medium:                        # CNXPHARMA, CNXIT
        max_lots_per_position: 100
        max_capital_pct: 3.0
    
  # Index Futures Margin Management
  margin_requirements:
    # SPAN + Exposure margin calculations
    span_margin_buffer_pct: 20.0           # 20% buffer over SPAN margin
    exposure_margin_buffer_pct: 15.0       # 15% buffer over exposure margin
    total_margin_buffer_pct: 25.0          # 25% total margin buffer
    
    # Real-time margin monitoring
    mark_to_market_frequency: "real_time"  # Continuous MTM
    margin_call_threshold_pct: 75.0        # Call at 75% margin utilization
    forced_liquidation_threshold_pct: 90.0 # Force square-off at 90%
    
    # Index-specific margin requirements
    margin_by_index:
      NIFTY:
        span_margin_typical_pct: 8.0       # Typical SPAN margin
        exposure_margin_pct: 3.0           # Exposure margin
        extreme_loss_margin_pct: 1.5       # ELM component
      BANKNIFTY:
        span_margin_typical_pct: 10.0      # Higher due to volatility
        exposure_margin_pct: 4.0
        extreme_loss_margin_pct: 2.0
      FINNIFTY:
        span_margin_typical_pct: 9.0
        exposure_margin_pct: 3.5
        extreme_loss_margin_pct: 1.8
      MIDCPNIFTY:
        span_margin_typical_pct: 12.0      # Higher for midcap volatility
        exposure_margin_pct: 5.0
        extreme_loss_margin_pct: 2.5
      CNXPHARMA:
        span_margin_typical_pct: 15.0      # Sector-specific volatility
        exposure_margin_pct: 6.0
        extreme_loss_margin_pct: 3.0
      CNXIT:
        span_margin_typical_pct: 11.0
        exposure_margin_pct: 4.5
        extreme_loss_margin_pct: 2.2
    
  # Drawdown and stop-loss limits
  drawdown_limits:
    max_daily_drawdown_pct: 3.0       # Stop trading if daily DD > 3%
    max_portfolio_drawdown_pct: 15.0  # System shutdown if portfolio DD > 15%
    consecutive_loss_limit: 5         # Stop after 5 consecutive losing trades
    
  # Volatility and market condition limits
  market_conditions:
    max_portfolio_volatility: 0.25    # 25% annualized portfolio volatility limit
    vix_trading_threshold: 35.0       # Stop aggressive strategies when VIX > 35
    min_liquidity_volume_cr: 50.0     # Minimum ₹50 cr daily volume to trade

# Data quality thresholds and validation rules
data_quality:
  # Volume and liquidity requirements
  liquidity_requirements:
    min_daily_volume_cr: 50.0         # Minimum ₹50 crores daily volume
    min_monthly_volume_cr: 1000.0     # Minimum ₹1000 crores monthly volume
    max_bid_ask_spread_bps: 10.0      # Maximum 0.1% bid-ask spread
    min_trade_frequency: 100          # Minimum 100 trades per day
    
  # Data completeness and accuracy
  data_completeness:
    min_market_hours_coverage_pct: 95.0  # 95% data availability required
    max_missing_bars_per_day: 20      # Max 20 missing 1-minute bars per day
    max_price_gap_pct: 5.0            # Flag price gaps > 5%
    max_volume_spike_multiple: 10.0   # Flag volume spikes > 10x average
    
  # Price validation rules
  price_validation:
    min_tick_compliance_pct: 99.0     # 99% of prices must comply with tick size
    max_ohlc_inconsistency_pct: 0.1   # Max 0.1% OHLC logical errors
    circuit_limit_buffer_pct: 2.0     # Stay 2% away from circuit limits

# Symbol mapping for different data providers
symbol_mapping:
  # Yahoo Finance symbol format
  yahoo_finance:
    suffix: ".NS"                     # NSE stocks end with .NS
    prefix: ""
    
  # Alpha Vantage symbol format  
  alpha_vantage:
    suffix: ".BSE"                    # Often uses BSE format
    prefix: ""
    
  # ICICI Direct symbol format
  icici_direct:
    prefix: "NSE:"                    # NSE: prefix for stocks
    suffix: ""
    
  # Internal standardized format
  internal:
    prefix: ""                        # Clean symbol names
    suffix: ""

# Slippage and market impact models
slippage_model:
  # Fixed slippage by position size
  fixed_slippage:
    small_position_bps: 1.0           # < ₹1 lakh position
    medium_position_bps: 2.0          # ₹1-10 lakh position  
    large_position_bps: 5.0           # > ₹10 lakh position
    
  # Dynamic slippage based on market conditions
  dynamic_slippage:
    base_slippage_bps: 2.0
    volatility_multiplier: 1.5        # Increase slippage during high vol
    volume_impact_factor: 0.1         # Impact based on volume participation
    
  # Time-based slippage (market open/close effects)
  time_based_slippage:
    market_open_multiplier: 2.0       # 2x slippage in first 30 minutes
    market_close_multiplier: 1.5      # 1.5x slippage in last 30 minutes
    lunch_time_multiplier: 1.2        # 1.2x during low volume periods

# Dynamic Universe Selection (expandable beyond fixed lists)
universe_selection:
  # Multi-tier liquidity approach instead of fixed top-50
  liquidity_tiers:
    tier_1_ultra_liquid:
      min_daily_volume_cr: 200.0      # Ultra liquid stocks
      max_position_size_pct: 5.0      # Higher position limits
      min_market_cap_cr: 50000.0      # Large cap only
      
    tier_2_liquid:  
      min_daily_volume_cr: 80.0       # High liquid stocks
      max_position_size_pct: 3.0
      min_market_cap_cr: 20000.0
      
    tier_3_medium_liquid:
      min_daily_volume_cr: 30.0       # Medium liquid stocks  
      max_position_size_pct: 2.0
      min_market_cap_cr: 8000.0
      
    tier_4_emerging:
      min_daily_volume_cr: 15.0       # Emerging opportunities
      max_position_size_pct: 1.0
      min_market_cap_cr: 3000.0
      
  # Strategy-specific universe filters
  strategy_universes:
    momentum_strategy:
      sectors: ["IT", "Pharma", "Auto", "Consumer"]
      min_roc_3m_pct: 10.0           # 10% momentum in 3 months
      min_volume_surge: 1.5          # 1.5x average volume
      exclude_high_beta: 2.5         # Exclude beta > 2.5
      
    mean_reversion_strategy:
      sectors: ["Banking", "FMCG", "Utilities"]
      rsi_range: [25, 75]            # RSI oversold/overbought zones
      stable_fundamentals: true
      min_dividend_yield_pct: 1.0
      
    breakout_strategy:
      include_mid_cap: true
      price_near_52w_high_pct: 90.0  # Within 10% of 52-week high
      volume_breakout_factor: 2.0    # 2x volume on breakout
      consolidation_period_days: 20  # After 20-day consolidation
      
  # Base eligibility criteria (applies to all tiers)
  base_criteria:
    # Listing and regulatory
    min_listing_years: 2             # Reduced from 3 for more opportunities
    exclude_penny_stocks_below: 10.0 # Reduced from ₹20 for mid-cap inclusion
    exclude_t2t_stocks: true
    exclude_gsm_stocks: true         # Graded Surveillance Measure
    
    # F&O availability (optional, not mandatory)
    fo_preferred: true               # Prefer F&O stocks but don't mandate
    min_oi_cr: 50.0                 # Reduced F&O requirement
    
    # Financial health (relaxed for broader universe)
    min_quarterly_revenue_cr: 500.0  # Reduced from 1000 for mid-cap inclusion
    positive_book_value: true
    max_debt_to_equity: 2.0         # Allow higher leverage for growth stocks
    
  # Dynamic screening (updated daily)
  dynamic_filters:
    # Technical health
    technical_health:
      max_bid_ask_spread_bps: 20.0   # Relaxed for mid-cap stocks
      min_trades_per_day: 25         # Reduced minimum trades
      price_impact_threshold: 0.5    # Max 0.5% price impact per ₹1cr trade
      
    # Fundamental momentum  
    fundamental_momentum:
      earnings_revision_trend: "positive"  # Analyst upgrades preferred
      sales_growth_yoy_pct: 5.0           # Minimum 5% sales growth
      exclude_loss_making: false          # Allow loss-making growth stocks
      
    # Market microstructure
    microstructure_quality:
      delivery_percentage_min: 20.0       # Min 20% delivery trading
      institutional_holding_min_pct: 5.0  # Min institutional interest
      free_float_turnover_max: 100.0      # Avoid excessive speculation
      
  # Sector allocation limits (prevent over-concentration)
  sector_limits:
    banking_max_pct: 25.0
    it_max_pct: 20.0
    auto_max_pct: 15.0
    pharma_max_pct: 15.0
    fmcg_max_pct: 10.0
    metals_max_pct: 10.0
    oil_gas_max_pct: 10.0
    others_max_pct: 15.0

# Performance benchmarks and targets
performance_targets:
  # Risk-adjusted return targets
  return_targets:
    min_annual_sharpe: 1.5            # Minimum 1.5 Sharpe ratio
    min_annual_sortino: 2.0           # Minimum 2.0 Sortino ratio
    target_calmar_ratio: 1.0          # Target 1.0 Calmar ratio
    
  # Risk management targets
  risk_targets:
    max_var_95_daily_pct: 2.0         # Max 2% daily VaR (95% confidence)
    target_hit_ratio_pct: 55.0        # Target 55% winning trades
    max_avg_loss_multiple: 1.5        # Max loss should be 1.5x avg profit

# System operational parameters
operational_params:
  # Order management
  order_management:
    max_order_value_cr: 10.0          # Max ₹10 cr per single order
    order_timeout_seconds: 30         # Cancel orders after 30 seconds
    max_pending_orders: 50            # Max 50 pending orders at once
    
  # System health monitoring
  system_monitoring:
    heartbeat_interval_seconds: 5     # System heartbeat every 5 seconds
    max_latency_ms: 100               # Max 100ms latency tolerance
    circuit_breaker_threshold: 3      # Circuit break after 3 system errors
    
  # Logging and audit
  audit_settings:
    log_all_orders: true              # Log every order placed
    log_all_fills: true               # Log every fill received
    retain_logs_days: 90              # Retain logs for 90 days

# Implementation Notes:
# 1. Universe is dynamically screened daily based on above criteria
# 2. Stocks are categorized into liquidity tiers with different position limits
# 3. Strategy-specific universes allow different approaches to target different opportunities
# 4. Base criteria ensure minimum quality while allowing broader opportunity set
# 5. Dynamic filters adapt to changing market conditions
#
# Sample implementation in agents/data_agent.py:
# def select_tradeable_universe(strategy_type, date):
#     all_stocks = screen_by_base_criteria(date)
#     tier_qualified = apply_liquidity_tiers(all_stocks, date)  
#     strategy_filtered = apply_strategy_filters(tier_qualified, strategy_type, date)
#     return strategy_filtered
#
# This approach allows:
# - Expansion beyond arbitrary "top 50" limit
# - Strategy-specific opportunity targeting  
# - Dynamic adaptation to market conditions
# - Risk-appropriate position sizing by liquidity tier
# - Sector rotation and emerging opportunity capture
